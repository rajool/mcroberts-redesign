# McRoberts: the redesign of mcroberts.sd38.bc.ca as a sub-theme of Bootstrap Barrio.
# Regions: the same machine names as rsd_sites_barrio (and every Bootstrap Barrio region), so installing this theme
# while rsd_sites_barrio is the default copies each block placement into the same region (block_theme_initialize()).
# No config/optional/block.block.* ships here on purpose: that copy only happens for a theme with no blocks.
name: McRoberts
type: theme
description: 'École Secondaire Hugh McRoberts Secondary School. Sub-theme of Bootstrap Barrio with the regions of rsd_sites_barrio.'
package: Custom
core_version_requirement: ^10.3 || ^11
base theme: bootstrap_barrio
logo: logo.png

libraries:
  - mcroberts/fonts
  - mcroberts/global

# Bootstrap CSS/JS, Barrio's component CSS and the module skins the theme replaces (research/drupal-mapping.md §9).
libraries-override:
  bootstrap_barrio/global-styling: false
  bootstrap_barrio/bootstrap: false
  bootstrap_barrio/bootstrap_cdn: false
  bootstrap_barrio/messages_white: false
  bootstrap_barrio/links: false
  bootstrap_barrio/file: false
  social_media_links/fontawesome.component: false
  bootstrap_paragraphs/bootstrap-paragraphs: false
  bootstrap_paragraphs/bp-accordion: false
  fitvids/fitvids: false
  fitvids/init: false
  colorbox/default: false

regions:
  top_header: 'Top header'
  top_header_form: 'Top header form'
  header: Header
  header_form: 'Header form'
  primary_menu: 'Primary menu'
  secondary_menu: 'Secondary menu'
  page_top: 'Page top'
  page_bottom: 'Page bottom'
  highlighted: Highlighted
  featured_top: 'Featured top'
  breadcrumb: Breadcrumb
  content: Content
  sidebar_first: 'Sidebar first'
  sidebar_second: 'Sidebar second'
  featured_bottom_first: 'Featured bottom first'
  featured_bottom_second: 'Featured bottom second'
  featured_bottom_third: 'Featured bottom third'
  footer_first: 'Footer first'
  footer_second: 'Footer second'
  footer_third: 'Footer third'
  footer_fourth: 'Footer fourth'
  footer_fifth: 'Footer fifth'
  accessibility_dropdown: 'Accessibility dropdown'
